  }
  /** 进度条满 + 浏览器**本来就允许自动出声** → 不挂闸门，**直接进游戏**（用户口径：
   *  “如果一加载完就可以播放警报音效，不需要玩家点击屏幕，那就不要请点击任意位置开始游戏，
   *   进度条满就直接进入游戏”）。收条后复用“已确认”标记等场景就绪再淡出（否则会露出引擎 logo）。 */
  function enterGame() {
    if (gateShown || hidden || autoEntered) { return; }
    autoEntered = true;
    hideBar();
    clicked = true; clickedAt = Date.now();
    tryFade();
    try { console.log('[pa-loading] 进度条已满 + 浏览器允许自动出声 → 直接进入游戏（不挂闸门）'); } catch (e) {}
  }
  /** 进度条满之后怎么走：能自动出声 → **直接进游戏**；真被浏览器拦住 → 挂“点击开始”闸门。
   *  `frame()` 和兜底定时器都用这一个函数，免得两条路分出不同结果（踩过：定时器直接 showGate，
   *  把“允许自动播放 → 直接进游戏”那条路整条绕过了）。 */
  function onBarFull() {
    if (gateShown || autoEntered || hidden) { return; }
    if (audioCanAutoPlay()) { enterGame(); } else { showGate(); }
  }
  /** 显示闸门：收起进度条、换成提示文字，并告诉游戏侧“先别开场”。
   *  **只在真被浏览器拦住音频时才挂**（探针 = suspended）——那一下点击既是进游戏、也是解锁手势。 */
  function showGate() {
    if (gateShown || hidden) { return; }
    gateShown = true;
    hideBar();
    if (startEl) {
      startEl.classList.add('pl-on');
      startEl.style.opacity = '1';
      // 聚焦按钮：键盘用户直接按 回车/空格（在聚焦按钮上会派发可信 click = 用户手势）也能进入游戏。
      // 先把焦点要回页面（编辑器内嵌预览/webview 里常见的情况），再聚焦按钮。
      try { window.focus(); } catch (eW) {}
      try { startEl.focus({ preventScroll: true }); } catch (e) { try { startEl.focus(); } catch (e2) {} }
    }
    // 游戏侧（StartMask）读这个标记：点击前不发开场警报、不放开场提示图、不走 2 分钟倒计时
    try { window.__paGatePending = true; } catch (e) {}
    // 控制台留痕：排查“进度条到底有没有被收走”时看这一条（旧缓存页面看不到）
    try { console.log('[pa-loading] 进度条已满 → 收起进度条，显示“请点击任意位置开始游戏”'); } catch (e) {}
  }
  /** 点击（且场景已就绪）才淡出；点击早于场景就绪时先记下，等场景起来再淡（否则会露出引擎启动画面） */
  function tryFade() {
    if (!clicked || hidden) { return; }
    if (sceneLaunched || (Date.now() - clickedAt) > 10000) { hideOverlay(); }
  }
  function onSceneLaunched() {
    if (sceneLaunched) { return; }
    sceneLaunched = true;
    // 场景起来了 = 加载完成（条会填满到 100% 后再换文字；这里**不直接 showGate**，
    // 否则会在“进度条还没满”的时候就把文字换出来 —— 用户反馈过的那个问题）
    markLoaded();
    tryFade();
  }
  /** 点击“开始游戏”：解锁音频（幂等）后进入游戏。**必须点一下才进**（不加超时放行）。 */
  function onGateClick() {
    if (!gateShown || hidden) { return; }
    clicked = true; clickedAt = Date.now();
    try { window.__paGatePending = false; } catch (e) {}
    try { window.dispatchEvent(new Event('pa-start')); } catch (e) {}
    unlockAudio();
    tryFade();
  }
  // 触发面尽量宽（这些都是“能给浏览器手势”的事件）：指针/鼠标按下与抬起、触摸结束、按键；
  // 另外 <button> 自身被点/被回车触发时还会走 click（见 startEl 的监听）——键盘也能进游戏。
  window.addEventListener('pointerdown', onGateClick, true);
  window.addEventListener('pointerup', onGateClick, true);
  window.addEventListener('touchstart', onGateClick, true);
  window.addEventListener('touchend', onGateClick, true);
  window.addEventListener('mousedown', onGateClick, true);
  window.addEventListener('mouseup', onGateClick, true);
  window.addEventListener('keydown', onGateClick, true);
  if (startEl) { startEl.addEventListener('click', onGateClick); }
  (function watchEngine() {
    var tries = 0;
    var iv = setInterval(function () {
      if (++tries > 1800) { clearInterval(iv); return; }     /* 最多等 3 分钟 */
      if (!window.System || !window.System.import) { return; }
      try {
        window.System.import('cc').then(function (cc) {
          clearInterval(iv);
          var ev = (cc.Director && cc.Director.EVENT_AFTER_SCENE_LAUNCH) ||
                   'director_after_scene_launch';
          if (cc.director && cc.director.once) { cc.director.once(ev, onSceneLaunched); }
        }, function () { /* import map 还没就绪，下一轮再来 */ });
      } catch (e) { /* 同上 */ }
    }, 100);
  })();

  /* ---------------- 主循环：平滑、单调、限速 ---------------- */
  var shown = 0, t0 = Date.now(), last = t0, tipShown = false, target = 0;

  function frame() {
    var now = Date.now();
    var dt = Math.min(0.25, Math.max(0.001, (now - last) / 1000));
    last = now;
    var elapsed = (now - t0) / 1000;

    var raw = tick(elapsed);                                  /* 各平台自己算**原始**进度 0~1 */
    if (loaded || sceneLaunched) { raw = 1; }                 /* 加载完成 → 把进度推到满 */
    var next = Math.min(Math.max(raw, Math.min(0.9, elapsed / 40)), 0.97);
    target = Math.max(target, next);
    if (loaded || sceneLaunched) { target = 1; }

    var prev = shown;
    shown += (target - shown) * Math.min(1, dt * 4);
    if (shown > prev + dt * 0.85) { shown = prev + dt * 0.85; }   /* 限速：别一闪而过 */
    if (shown < prev) { shown = prev; }                            /* 单调：不回退 */

    fillEl.style.width = (shown * 100).toFixed(2) + '%';
    pctEl.textContent = Math.round(shown * 100) + '%';

    // **进度条填满之后**才收起它、换成“请点击任意位置开始游戏”（用户口径：没满之前不许换文字）。
    // 填满后先停 250ms 让玩家看见“满格 + 100%”，再换文字。
    if (!gateShown && !autoEntered && loaded && shown >= 0.999) {
      if (!fullSince) { fullSince = Date.now(); }
      else if (Date.now() - fullSince > 250) {
        onBarFull();
      }
    }
    if (!tipShown && !sceneLaunched && elapsed > 20 && shown < 0.9) {
      tipShown = true;
      tipEl.classList.add('pl-show');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* 兜底：**满格后必须分流**（收条 + 进游戏 / 挂闸门），且不依赖 requestAnimationFrame ——
     切到后台 / 省电模式下 rAF 会被节流甚至暂停，那时 shown 已经到 1 也没有人再调 frame()，
     进度条就会一直停在满格。这个定时器与 frame() 共用同一份闭包变量和同一个 onBarFull()，
     连“填满后停 250ms（看见满格）”也在这里诚实地重计一遍（rAF 停了 fullSince 没人置）。 */
  setInterval(function () {
    if (!loaded || shown < 0.999) { return; }
    if (!fullSince) { fullSince = Date.now(); return; }
    if (Date.now() - fullSince > 250) { onBarFull(); }
  }, 250);
  try { console.log('[pa-loading] 加载界面 v2026-09-23（满格 → 收起进度条 → 点击开始）'); } catch (e) {}
})();
</script>
